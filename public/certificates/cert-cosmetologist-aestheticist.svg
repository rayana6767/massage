<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="cosmeticBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF9"/>
      <stop offset="100%" stop-color="#F5EFEB"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1200" height="850" fill="#EAE2DA"/>
  
  <!-- Certificate Sheet -->
  <rect x="50" y="50" width="1100" height="750" rx="18" fill="url(#cosmeticBg)" stroke="#D8CBC0" stroke-width="4" filter="url(#cardShadow)"/>
  <rect x="70" y="70" width="1060" height="710" rx="12" fill="none" stroke="#E2D5C8" stroke-width="1.5"/>

  <!-- Left Content Column -->
  <g transform="translate(100, 110)">
    <text x="0" y="50" font-family="'Manrope', sans-serif" font-size="46" font-weight="800" fill="#201C1A" letter-spacing="6">СЕРТИФИКАТ</text>
    
    <text x="0" y="140" font-family="'Manrope', sans-serif" font-size="20" font-weight="500" fill="#6A625C">Выдан</text>
    <text x="80" y="140" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" font-style="italic" fill="#201C1A">Пазылова Жийдегул</text>
    <line x1="75" y1="150" x2="480" y2="150" stroke="#201C1A" stroke-width="1.2"/>

    <text x="0" y="215" font-family="'Manrope', sans-serif" font-size="16" font-weight="500" fill="#6A625C">Настоящий сертификат подтверждает то,</text>
    <text x="0" y="240" font-family="'Manrope', sans-serif" font-size="16" font-weight="500" fill="#6A625C">что она прослушала курс обучения по теме</text>

    <!-- Course Banner -->
    <rect x="0" y="270" width="560" height="70" rx="10" fill="#201C1A"/>
    <text x="280" y="315" font-family="'Manrope', sans-serif" font-size="25" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">КОСМЕТОЛОГ-ЭСТЕТИСТ</text>

    <text x="0" y="420" font-family="'Manrope', sans-serif" font-size="19" font-weight="600" fill="#3D3733">Преподаватель Наурузова Диляра</text>
    
    <!-- Signature Flourish -->
    <path d="M 0,480 C 40,430 30,510 70,440 C 90,400 110,500 140,450 C 170,430 190,470 230,450" fill="none" stroke="#201C1A" stroke-width="2.5" stroke-linecap="round"/>

    <text x="0" y="580" font-family="'Manrope', sans-serif" font-size="18" font-weight="600" fill="#4B443F">12 июля 2026 г.</text>
  </g>

  <!-- Right Column Portrait Box -->
  <g transform="translate(730, 110)">
    <rect x="0" y="0" width="370" height="630" rx="16" fill="#EDE4DC" stroke="#D3C3B4" stroke-width="1.5"/>
    <!-- Elegant Portrait Silhouette representation -->
    <defs>
      <clipPath id="portClip">
        <rect x="0" y="0" width="370" height="630" rx="16"/>
      </clipPath>
    </defs>
    <g clip-path="url(#portClip)">
      <rect width="370" height="630" fill="#F4EDE7"/>
      <!-- Soft background aura -->
      <circle cx="185" cy="240" r="140" fill="#E8DCD2"/>
      <!-- Portrait graphic: female silhouette in blazer -->
      <circle cx="185" cy="200" r="75" fill="#38312D"/>
      <path d="M 125,230 Q 185,285 245,230" fill="#ECC9B5"/>
      <circle cx="185" cy="210" r="45" fill="#ECC9B5"/>
      <!-- Hair frame -->
      <path d="M 130,190 C 130,120 240,120 240,190 C 255,270 230,320 230,320 C 210,290 215,240 185,240 C 155,240 160,290 140,320 C 140,320 115,270 130,190 Z" fill="#201C1A"/>
      <!-- Blazer body -->
      <path d="M 90,630 L 90,390 Q 185,340 280,390 L 280,630 Z" fill="#1C1816"/>
      <path d="M 155,370 L 185,460 L 215,370 Z" fill="#FFFFFF"/>
      <path d="M 140,370 L 185,530 L 130,630 Z" fill="#2E2825"/>
      <path d="M 230,370 L 185,530 L 240,630 Z" fill="#2E2825"/>
      <rect x="25" y="550" width="320" height="55" rx="12" fill="#FFFFFF" opacity="0.9" stroke="#E2D5C8"/>
      <text x="185" y="584" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#2C2623" text-anchor="middle">Мастер Жийдегул Пазылова</text>
    </g>
  </g>
</svg>