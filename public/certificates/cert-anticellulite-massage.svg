<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFDFD"/>
      <stop offset="100%" stop-color="#F4F8FA"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="850" fill="#E8EEF1"/>
  
  <!-- Certificate Sheet -->
  <rect x="40" y="40" width="1120" height="770" rx="16" fill="url(#cardBg)" stroke="#8FA8B5" stroke-width="6" filter="url(#shadow)"/>
  <rect x="65" y="65" width="1070" height="720" rx="10" fill="none" stroke="#B8CBD4" stroke-width="2"/>
  <rect x="75" y="75" width="1050" height="700" rx="6" fill="none" stroke="#2C3E50" stroke-width="1.5" opacity="0.35"/>

  <!-- Academy Logo Emblem -->
  <g transform="translate(600, 140)">
    <circle cx="0" cy="0" r="48" fill="#E3F2F7" stroke="#68A5BA" stroke-width="3"/>
    <ellipse cx="0" cy="18" rx="34" ry="7" fill="none" stroke="#2C4D5B" stroke-width="3"/>
    <!-- Figure icon -->
    <circle cx="0" cy="-14" r="9" fill="#58A8B3"/>
    <path d="M-18,-2 Q0,-10 18,-2 Q6,22 -18,-2" fill="#71BCC4"/>
    <path d="M-22,12 Q0,6 22,12" fill="none" stroke="#2C4D5B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Headers -->
  <text x="600" y="240" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="600" fill="#202A30" text-anchor="middle" letter-spacing="1">Certificate of appreciation</text>
  <text x="600" y="280" font-family="'Manrope', sans-serif" font-size="22" font-weight="600" fill="#4B636E" text-anchor="middle" letter-spacing="2">Академия массажных технологий</text>

  <!-- Recipient Section -->
  <text x="320" y="345" font-family="'Manrope', sans-serif" font-size="18" font-weight="400" fill="#5A6C75">Сертификат выдан</text>
  <text x="600" y="345" font-family="'Manrope', sans-serif" font-size="28" font-weight="700" fill="#1C272C" text-anchor="middle">Пазыловой Жийдегул Икрамовне</text>
  <line x1="480" y1="358" x2="980" y2="358" stroke="#1C272C" stroke-width="1.5"/>

  <text x="600" y="405" font-family="'Manrope', sans-serif" font-size="17" font-weight="500" fill="#6A7A82" text-anchor="middle">и подтверждает успешное прохождение теоретического и практического курса</text>

  <!-- Course Title Box -->
  <rect x="180" y="440" width="840" height="90" rx="14" fill="#F0F6F9" stroke="#CCDCE3" stroke-width="1"/>
  <text x="600" y="495" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#193542" text-anchor="middle">Ручной антицеллюлитный массаж</text>
  <text x="600" y="555" font-family="'Manrope', sans-serif" font-size="17" font-weight="500" fill="#435B66" text-anchor="middle">с освоением полной методики работы</text>

  <!-- Instructor and Blue Stamp -->
  <g transform="translate(180, 680)">
    <text x="0" y="0" font-family="'Manrope', sans-serif" font-size="18" font-weight="600" fill="#2C3B42">Преподаватель: Моисеева Д. В.</text>
    <line x1="140" y1="18" x2="380" y2="18" stroke="#2C3B42" stroke-width="1.2"/>
    <!-- Stamp -->
    <g transform="translate(240, -10)" opacity="0.82">
      <circle cx="0" cy="0" r="54" fill="none" stroke="#2A5C9A" stroke-width="2.5" stroke-dasharray="8,4"/>
      <circle cx="0" cy="0" r="46" fill="none" stroke="#2A5C9A" stroke-width="1.5"/>
      <text font-family="'Manrope', sans-serif" font-size="8" font-weight="700" fill="#2A5C9A" text-anchor="middle" letter-spacing="1">
        <textPath href="#circlePathTop">АКАДЕМИЯ МАССАЖНЫХ ТЕХНОЛОГИЙ</textPath>
      </text>
      <path id="circlePathTop" d="M -38,0 A 38,38 0 0,1 38,0" fill="none"/>
      <text x="0" y="4" font-family="'Manrope', sans-serif" font-size="10" font-weight="bold" fill="#2A5C9A" text-anchor="middle">СЕРТИФИКАТ</text>
      <text x="0" y="16" font-family="'Manrope', sans-serif" font-size="8" fill="#2A5C9A" text-anchor="middle">г. Москва / СПб</text>
    </g>
    <!-- Handwritten signature flourish -->
    <path d="M 160,-5 C 190,-35 180,25 210,-15 C 230,-40 240,15 270,-10 C 290,-30 300,5 340,-5" fill="none" stroke="#1D3F72" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Date and City -->
  <g transform="translate(850, 660)">
    <text x="0" y="0" font-family="'Manrope', sans-serif" font-size="18" font-weight="600" fill="#2C3B42" text-anchor="middle">Дата</text>
    <text x="0" y="32" font-family="'Manrope', sans-serif" font-size="22" font-weight="700" fill="#1A272C" text-anchor="middle">30.10.2025</text>
    <line x1="-100" y1="42" x2="100" y2="42" stroke="#2C3B42" stroke-width="1.5"/>
    <text x="0" y="66" font-family="'Manrope', sans-serif" font-size="16" font-weight="500" fill="#4B636E" text-anchor="middle">г. Санкт-Петербург</text>
  </g>
</svg>